# Weekly update pull requests for NuGet packages and for the actions the workflows use.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      avalonia:
        patterns: ["Avalonia*"]
      test:
        patterns: ["xunit*", "Microsoft.Testing.*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
